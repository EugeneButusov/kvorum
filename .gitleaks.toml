title = "Kvorum gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = "Planning docs and SPEC — intentional placeholder patterns"
regexTarget = "line"
regexes = [
  '''REPLACE_BEFORE_DEPLOY''',
  '''kvorum\.example''',
]

[[allowlists]]
description = "Known-issue registry examples and test fixtures"
regexTarget = "line"
regexes = [
  '''KNOWN-\d{3}''',
]

[[allowlists]]
description = "Ethereum addresses — 0x-prefixed 40-hex-char strings are public chain identifiers, not secrets"
ruleIDs = ["generic-api-key"]
regexTarget = "secret"
regexes = ['''(?i)0x[0-9a-f]{40}''']
