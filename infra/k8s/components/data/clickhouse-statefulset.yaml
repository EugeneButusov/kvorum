# Source of truth for derived data (ADR-0062), so it moves host rather than being dropped.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kvorum-clickhouse
  labels:
    app.kubernetes.io/name: kvorum-clickhouse
    app.kubernetes.io/part-of: kvorum
spec:
  serviceName: kvorum-clickhouse
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kvorum-clickhouse
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kvorum-clickhouse
        app.kubernetes.io/part-of: kvorum
    spec:
      containers:
        - name: clickhouse
          # Pin the version validated by kvorum-limits.xml. A floating major tag can
          # silently change server settings when the pod lands on a fresh node.
          image: clickhouse/clickhouse-server:24.10.2.80
          ports:
            - name: http
              containerPort: 8123
          env:
            - name: CLICKHOUSE_DB
              value: kvorum
            - name: CLICKHOUSE_USER
              valueFrom:
                secretKeyRef:
                  name: kvorum-secrets
                  key: CLICKHOUSE_USER
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kvorum-secrets
                  key: CLICKHOUSE_PASSWORD
            - name: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT
              value: '1'
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 45
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 150m
              memory: 640Mi
            limits:
              memory: 1280Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/clickhouse
            # subPath is required: mounting the directory shadows the image's
            # docker_related_config.xml, which sets listen_host, leaving the server on
            # loopback only. Cost: ConfigMap edits need the pod recreated.
            - name: config
              mountPath: /etc/clickhouse-server/config.d/kvorum-limits.xml
              subPath: kvorum-limits.xml
      volumes:
        - name: config
          configMap:
            name: kvorum-clickhouse-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ['ReadWriteOnce']
        resources:
          requests:
            storage: 10Gi
