# pgvector image (same as docker-compose.yml): the app role owns the database, so ai_003's
# CREATE EXTENSION vector needs no privileged pre-step.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kvorum-postgres
  labels:
    app.kubernetes.io/name: kvorum-postgres
    app.kubernetes.io/part-of: kvorum
spec:
  serviceName: kvorum-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kvorum-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kvorum-postgres
        app.kubernetes.io/part-of: kvorum
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          image: pgvector/pgvector:pg18
          args:
            - postgres
            - -c
            - shared_buffers=192MB
            - -c
            - max_connections=100
          ports:
            - name: postgres
              containerPort: 5432
          env:
            # Must be a subdirectory of the mount, not the PVC root.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_DB
              value: kvorum
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: kvorum-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kvorum-secrets
                  key: POSTGRES_PASSWORD
          readinessProbe:
            exec:
              command: ['sh', '-c', 'pg_isready -U "$POSTGRES_USER" -d kvorum']
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ['sh', '-c', 'pg_isready -U "$POSTGRES_USER" -d kvorum']
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 320Mi
            limits:
              memory: 768Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ['ReadWriteOnce']
        resources:
          requests:
            storage: 10Gi
