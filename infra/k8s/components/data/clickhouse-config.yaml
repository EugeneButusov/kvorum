# Caches trimmed hard: this node also carries Postgres, four Node services and Prometheus,
# and the dataset is tiny (ADR-038).
apiVersion: v1
kind: ConfigMap
metadata:
  name: kvorum-clickhouse-config
  labels:
    app.kubernetes.io/name: kvorum-clickhouse
    app.kubernetes.io/part-of: kvorum
data:
  kvorum-limits.xml: |
    <clickhouse>
        <max_server_memory_usage>805306368</max_server_memory_usage>
        <mark_cache_size>134217728</mark_cache_size>
        <uncompressed_cache_size>0</uncompressed_cache_size>
        <max_concurrent_queries>32</max_concurrent_queries>
        <!-- Do NOT set background_pool_size: below ~10 the server exits BAD_ARGUMENTS,
             since it must stay >= number_of_free_entries_in_pool_to_execute_mutation
             divided by the concurrency ratio. -->
        <!-- Console, not the image's default file logging, which hides startup errors. -->
        <logger>
            <level>warning</level>
            <console>1</console>
        </logger>
    </clickhouse>
