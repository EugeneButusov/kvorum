# Small volume so metric history survives pod restarts/deploys. 5Gi is ample for 7-day
# retention of the low-cardinality kvorum series (~3 targets). Provisioned by the default
# StorageClass — on the single-node k3s host that is `local-path`, which uses the node's own
# disk and costs nothing, rather than a billed do-block-storage volume.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kvorum-prometheus-data
  labels:
    app.kubernetes.io/name: kvorum-prometheus
    app.kubernetes.io/part-of: kvorum
spec:
  accessModes: ['ReadWriteOnce']
  resources:
    requests:
      storage: 5Gi
