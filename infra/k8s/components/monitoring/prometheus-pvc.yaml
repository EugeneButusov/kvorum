# Small volume so metric history survives pod restarts. 5Gi covers 7-day retention of the
# low-cardinality kvorum series. The default StorageClass on k3s is `local-path` (node disk).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kvorum-prometheus-data
  labels:
    app.kubernetes.io/name: kvorum-prometheus
    app.kubernetes.io/part-of: kvorum
spec:
  accessModes: ['ReadWriteOnce']
  resources:
    requests:
      storage: 5Gi
