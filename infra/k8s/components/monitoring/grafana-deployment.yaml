# Self-hosted Grafana UI. Stateless: the datasource + dashboards come from the mounted
# provisioning ConfigMaps (the dashboards ConfigMap is generated by kustomize from
# dashboards/*.json, so editing a dashboard + redeploying rolls this pod and reloads it).
# Internet-reachable via the Cloudflare Tunnel (grafana.kvorum.watch), so it runs with an
# admin password from kvorum-secrets — never anonymous.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kvorum-grafana
  labels:
    app.kubernetes.io/name: kvorum-grafana
    app.kubernetes.io/part-of: kvorum
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kvorum-grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kvorum-grafana
        app.kubernetes.io/part-of: kvorum
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        fsGroup: 472
      containers:
        - name: grafana
          image: grafana/grafana:11.4.0
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kvorum-secrets
                  key: GRAFANA_ADMIN_PASSWORD
            # Public URL behind the tunnel — makes share links / redirects correct.
            - name: GF_SERVER_ROOT_URL
              value: https://grafana.kvorum.watch
            - name: GF_USERS_DEFAULT_THEME
              value: dark
            # Belt-and-suspenders: never allow anonymous access on an internet-reachable UI.
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: 'false'
          volumeMounts:
            - name: datasource
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
              readOnly: true
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
      volumes:
        - name: datasource
          configMap:
            name: kvorum-grafana-datasource
        - name: dashboard-provider
          configMap:
            name: kvorum-grafana-dashboard-provider
        - name: dashboards
          configMap:
            name: kvorum-grafana-dashboards
