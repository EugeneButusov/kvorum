# Prometheus scrape config. The three backend processes expose Prometheus text on
# :9091 (container port named `metrics`); indexer and ai-worker have no Service, so
# discovery is by POD, not endpoints. renderMetrics() attaches no service label, so we
# stamp `job` (from the app.kubernetes.io/name label) and `instance` (pod name) here —
# that plus the metric-name prefix (ai_worker_/api_/indexer_) separates the processes.
# Editing this ConfigMap needs a `rollout restart deploy/kvorum-prometheus` to take effect.
apiVersion: v1
kind: ConfigMap
metadata:
  name: kvorum-prometheus-config
  labels:
    app.kubernetes.io/name: kvorum-prometheus
    app.kubernetes.io/part-of: kvorum
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s
      scrape_timeout: 10s
    scrape_configs:
      - job_name: kvorum-pods
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [kvorum]
        relabel_configs:
          # only kvorum workloads
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_part_of]
            regex: kvorum
            action: keep
          # only the container port named "metrics" (9091); drops the dashboard (no metrics port)
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            regex: metrics
            action: keep
          # job = kvorum-api / kvorum-indexer / kvorum-ai-worker
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            target_label: job
          # instance = pod name
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: instance
