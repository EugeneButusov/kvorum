apiVersion: v1
kind: ConfigMap
metadata:
  name: kvorum-backup-scripts
  labels:
    app.kubernetes.io/name: kvorum-backup
    app.kubernetes.io/part-of: kvorum
data:
  dump.sh: |
    #!/bin/sh
    set -eu
    OUT=/backup
    rm -rf "$OUT"/* 2>/dev/null || true

    echo "[dump] postgres"
    pg_dump -Fc --no-owner --no-privileges -f "$OUT/postgres.dump" "$DATABASE_URL"

    # ClickHouse over the HTTP interface. Only *MergeTree tables hold data — the
    # projection VIEWs and the MVs are derived and rebuild from these on restore.
    #
    # busybox wget, not curl: postgres:*-alpine ships no curl, and installing one at job
    # runtime would add a network dependency to the backup path. Credentials go in headers
    # rather than the URL so they stay out of process args and logs.
    CH_Q() {
      wget -q -O- \
        --header="X-ClickHouse-User: $CLICKHOUSE_USER" \
        --header="X-ClickHouse-Key: $CLICKHOUSE_PASSWORD" \
        --post-data="$1" \
        "$CLICKHOUSE_URL/?database=$CLICKHOUSE_DATABASE"
    }

    echo "[dump] clickhouse table list"
    CH_Q "SELECT name FROM system.tables WHERE database = '$CLICKHOUSE_DATABASE' \
      AND engine LIKE '%MergeTree' ORDER BY name FORMAT TabSeparated" > "$OUT/ch-tables.txt"
    wc -l < "$OUT/ch-tables.txt" | tr -d ' ' | xargs echo "[dump] clickhouse tables:"

    while IFS= read -r t; do
      [ -n "$t" ] || continue
      CH_Q "SELECT * FROM \`$t\` FORMAT Native" > "$OUT/ch__$t.native"
    done < "$OUT/ch-tables.txt"

    echo "[dump] compressing"
    gzip -f "$OUT"/*.dump "$OUT"/*.native
    ls -la "$OUT"
  upload.sh: |
    #!/bin/sh
    set -eu
    STAMP=$(date -u +%Y%m%dT%H%M%SZ)
    DOW=$(date -u +%u)

    echo "[upload] daily/$STAMP"
    rclone --config /dev/null copy /backup "r2:$R2_BUCKET/daily/$STAMP/" --s3-no-check-bucket

    # Sunday's dump is also kept on the longer weekly rotation.
    if [ "$DOW" = "7" ]; then
      echo "[upload] weekly/$STAMP"
      rclone --config /dev/null copy /backup "r2:$R2_BUCKET/weekly/$STAMP/" --s3-no-check-bucket
    fi

    # Retention: 7 daily, 4 weekly. Prune objects first, then the empty prefixes.
    echo "[upload] pruning"
    rclone --config /dev/null delete --min-age 7d  "r2:$R2_BUCKET/daily/"  || true
    rclone --config /dev/null delete --min-age 28d "r2:$R2_BUCKET/weekly/" || true
    rclone --config /dev/null rmdirs --leave-root "r2:$R2_BUCKET/daily/"  || true
    rclone --config /dev/null rmdirs --leave-root "r2:$R2_BUCKET/weekly/" || true

    echo "[upload] done; current contents:"
    rclone --config /dev/null lsf "r2:$R2_BUCKET/" --dirs-only
