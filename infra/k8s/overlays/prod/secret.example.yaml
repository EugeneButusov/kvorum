# ─────────────────────────────────────────────────────────────────────────────
# EXAMPLE ONLY — DO NOT fill in real values here and DO NOT commit a filled copy.
# This file documents the keys the `kvorum-secrets` Secret must contain. It is NOT
# referenced by any kustomization, so `kubectl apply -k` never creates it.
#
# The real Secret lives ONLY in the cluster and is created out-of-band from your
# password manager, e.g.:
#
#   kubectl -n kvorum create secret generic kvorum-secrets \
#     --from-literal=DATABASE_URL='postgresql://...' \
#     --from-literal=CLICKHOUSE_URL='https://<elestio-host>:8443' \
#     --from-literal=CLICKHOUSE_USER='...' \
#     --from-literal=CLICKHOUSE_PASSWORD='...' \
#     --from-literal=CLICKHOUSE_DATABASE='kvorum' \
#     --from-literal=REDIS_URL='rediss://...upstash.io:6379' \
#     --from-literal=CURSOR_SECRET='...' \
#     --from-literal=HMAC_PEPPER_CURRENT='...' \
#     --from-literal=CHAIN_CONFIG='{"chains":[...]}' \
#     --from-literal=SNAPSHOT_API_KEY='...' \
#     --from-literal=ETHERSCAN_API_KEY='...' \
#     --from-literal=ANTHROPIC_API_KEY='...' \
#     --from-literal=OPENAI_API_KEY='...' \
#     --from-literal=GRAFANA_ADMIN_PASSWORD='...' \
#     --from-literal=TUNNEL_TOKEN='...'
#
# Rotate with `kubectl create secret ... --dry-run=client -o yaml | kubectl apply -f -`
# then restart the workloads: kubectl -n kvorum rollout restart deploy/kvorum-api deploy/kvorum-indexer
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: kvorum-secrets
  namespace: kvorum
type: Opaque
stringData:
  # ── Datastores ──
  # Postgres and ClickHouse run in-cluster (components/data) and initialise from the USER /
  # PASSWORD keys below on first start. The URLs must agree with them.
  # No sslmode/uselibpqcompat: traffic stays on the node.
  POSTGRES_USER: 'kvorum'
  POSTGRES_PASSWORD: 'REPLACE_ME' # openssl rand -hex 24
  DATABASE_URL: 'postgresql://kvorum:REPLACE_ME@kvorum-postgres.kvorum:5432/kvorum'
  CLICKHOUSE_USER: 'kvorum'
  CLICKHOUSE_PASSWORD: 'REPLACE_ME' # openssl rand -hex 24
  CLICKHOUSE_URL: 'http://kvorum-clickhouse.kvorum:8123'
  CLICKHOUSE_DATABASE: 'kvorum'
  REDIS_URL: 'rediss://default:PASSWORD@HOST.upstash.io:6379' # Upstash (TLS), external
  # ── App secrets ──
  CURSOR_SECRET: 'REPLACE_ME' # signs pagination cursors; API fails to boot if unset
  HMAC_PEPPER_CURRENT: 'REPLACE_ME' # base64 32 bytes: openssl rand -base64 32
  # HMAC_PEPPER_PREVIOUS: ""        # optional grace-window pepper during rotation
  # Shared secret the dashboard BFF presents to read the API on behalf of anonymous users
  # (ADR-084). Consumed by BOTH the API (ApiKeyGuard) and the dashboard (single-key ref).
  # openssl rand -base64 32. When unset, anonymous public reads require a real API key.
  INTERNAL_READ_TOKEN: 'REPLACE_ME'
  # ADR-028 chain/provider JSON; holds RPC API keys. Sizing rules: deployment.md § Chain config.
  CHAIN_CONFIG: '{"chains":[]}'
  SNAPSHOT_API_KEY: 'REPLACE_ME'
  ETHERSCAN_API_KEY: 'REPLACE_ME'
  # ── AI worker (apps/ai-worker) ──
  # Required by the ai-worker for LLM calls. The code falls back to sentinel strings
  # ('unset-anthropic-key' / 'unset-openai-key') when absent, so the worker boots
  # healthy and fails only on the FIRST LLM call — set these before enabling any
  # AI_TRIGGER_*/AI_BACKFILL_* flag. ANTHROPIC = summaries/mismatch/forum; OPENAI =
  # embeddings (similar-proposals).
  ANTHROPIC_API_KEY: 'REPLACE_ME'
  OPENAI_API_KEY: 'REPLACE_ME'
  # ── Observability (components/monitoring) ──
  # Grafana admin login password. Grafana is internet-reachable via the tunnel
  # (grafana.kvorum.watch), so it never runs anonymous — it consumes ONLY this key
  # (secretKeyRef). Pick a strong value: openssl rand -base64 24.
  GRAFANA_ADMIN_PASSWORD: 'REPLACE_ME'
  # ── Ingress ──
  TUNNEL_TOKEN: 'REPLACE_ME' # Cloudflare Tunnel connector token
