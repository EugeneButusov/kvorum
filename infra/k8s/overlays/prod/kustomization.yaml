# Production overlay — single-node k3s, ~$25/mo infrastructure target.
#
# Topology: one s-2vcpu-4gb droplet. Postgres and ClickHouse run in-cluster on
# local-path volumes; Redis remains external on Upstash. Runtime credentials are
# wired through the in-cluster kvorum-secrets Secret (see secret.example.yaml —
# created out-of-band, never committed).
#
# CI sets the image tag on deploy:
#   kustomize edit set image ghcr.io/kvorum/kvorum=ghcr.io/<owner>/kvorum:<sha>
#
# Scale-up levers (all here, never in base/):
#   - add a node → soft topology-spread fans replicas out automatically
#   - raise api-hpa maxReplicas (patch below)
#   - split onto dedicated node pools → add a nodeSelector patch
#   - swap components/expose-tunnel → components/expose-lb for a load balancer
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kvorum

resources:
  - namespace.yaml
  - ../../base

components:
  - ../../components/expose-tunnel
  - ../../components/data
  - ../../components/backup
  # Self-hosted Prometheus + Grafana (cost/health dashboards). Overlay-only so
  # monitoring stays an opt-in per-environment concern. See components/monitoring.
  - ../../components/monitoring

images:
  - name: ghcr.io/kvorum/kvorum
    newTag: latest
