apiVersion: apps/v1
kind: Deployment
metadata:
  name: kvorum-ai-worker
  labels:
    app.kubernetes.io/name: kvorum-ai-worker
    app.kubernetes.io/part-of: kvorum
spec:
  # SINGLETON. The worker's @Interval scanners (trigger scan, batch cycle, budget
  # cap, backfill tick) are not leader-elected — two replicas would double-scan and
  # double-enqueue. pg-boss distributes the actual jobs, but the producers must be
  # single. Keep replicas at 1 and never HPA it. Recreate (not RollingUpdate)
  # guarantees the old pod is gone before the new one starts.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: kvorum-ai-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kvorum-ai-worker
        app.kubernetes.io/part-of: kvorum
    spec:
      # No podAntiAffinity: unlike the indexer, the AI worker does not need its own
      # node. It is mostly idle (polls every 60s; LLM work is off-box via the
      # Anthropic/OpenAI APIs), so it co-schedules on whichever of the 2 prod nodes
      # has room. If it ever stays Pending on memory, bump the node pool in the prod
      # overlay — see docs/runbooks/deployment.md.
      containers:
        - name: ai-worker
          image: ghcr.io/kvorum/kvorum:latest
          command: ['node', 'dist/apps/ai-worker/main.js']
          ports:
            - name: metrics
              containerPort: 9091
          envFrom:
            - configMapRef:
                name: kvorum-config
            - secretRef:
                name: kvorum-secrets
          env:
            - name: OTEL_SERVICE_NAME
              value: ai-worker
            # The ai-worker holds TWO Postgres pools — the app pool (PG_POOL_MAX) and pg-boss's own
            # (PGBOSS_POOL_MAX). Their sum plus api + indexer must stay under the ~25-connection
            # managed PG limit. See the PG_POOL_MAX note in libs/db/src/client.ts.
            - name: PG_POOL_MAX
              value: '3'
            - name: PGBOSS_POOL_MAX
              value: '3'
          # No app HTTP port — probes hit /health on the ops server (OPS_PORT).
          readinessProbe:
            httpGet:
              path: /health
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: metrics
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
