# Horizontal autoscaling for the API only. Requires metrics-server, which k3s
# installs by default. The indexer is deliberately absent — it is a hard singleton.
# Scale-up lever: raise maxReplicas in the overlay once the node pool has headroom. It is 1
# on a single node, where a second replica competes for the same CPU rather than adding
# capacity. The ~25-connection managed-PG ceiling that capped this at 2 no longer applies.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: kvorum-api
  labels:
    app.kubernetes.io/part-of: kvorum
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: kvorum-api
  minReplicas: 1
  maxReplicas: 1
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
