# Horizontal autoscaling for the API only. Requires metrics-server (present by
# default on DOKS). The indexer is deliberately absent — it is a hard singleton.
# Scale-up lever: raise maxReplicas in the overlay once the node pool has headroom.
# maxReplicas is 2 (not 3) because the managed PG allows only ~25 connections: with
# PG_POOL_MAX=2 per api replica, 2 replicas + indexer (5) + ai-worker (3 + pg-boss 3)
# = ~15, under the usable budget. Raising it requires more PG connections (larger
# tier or a PgBouncer connection pool) — see the PG_POOL_MAX note in libs/db/src/client.ts.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: kvorum-api
  labels:
    app.kubernetes.io/part-of: kvorum
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: kvorum-api
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
