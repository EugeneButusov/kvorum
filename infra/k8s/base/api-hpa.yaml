# Horizontal autoscaling for the API only. Requires metrics-server (present by
# default on DOKS). The indexer is deliberately absent — it is a hard singleton.
# Scale-up lever: raise maxReplicas in the overlay once the node pool has headroom.
# maxReplicas is 1 on the single-node topology: a second replica competes for the same
# node's CPU rather than adding capacity. The ~25-connection managed-PG ceiling that
# previously capped this at 2 no longer applies — in-cluster Postgres runs
# max_connections=100 — so node capacity is the only remaining constraint.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: kvorum-api
  labels:
    app.kubernetes.io/part-of: kvorum
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: kvorum-api
  minReplicas: 1
  maxReplicas: 1
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
