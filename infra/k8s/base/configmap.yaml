# Non-secret runtime configuration shared by api + indexer + ai-worker + dashboard.
# Secrets (DATABASE_URL, CLICKHOUSE_*, CURSOR_SECRET, CHAIN_CONFIG, ANTHROPIC_API_KEY,
# OPENAI_API_KEY, ...) live in the `kvorum-secrets` Secret, provisioned per-environment
# — see overlays/prod/secret.example.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: kvorum-config
data:
  # @libs/observability throws on import if the namespace is unset — must be present
  # (ignored by the dashboard, which is a plain Next process).
  OTEL_SERVICE_NAMESPACE: kvorum
  # Ops HTTP port (/metrics + /health) for every process.
  OPS_PORT: '9091'
  # API app port.
  API_PORT: '3001'
  # Dashboard-only: in-cluster API base URL its BFF/SSR calls (ADR-084). Resolves to
  # the kvorum-api Service (port 80 → api :3001). The browser never uses this — it
  # only ever talks to the dashboard's same-origin /api/* proxy.
  BACKEND_API_URL: http://kvorum-api.kvorum
  # Dashboard-only: deployment label shown in the footer (deployment · <env>). This is
  # the prod base; overlays can override per-environment. Unset locally → footer reads `local`.
  DEPLOYMENT_ENV: production
  # Indexer live-poll cadence. Governance voting windows last days, so polling every few
  # seconds spends provider (Alchemy) quota to learn nothing new — a slower poll just folds
  # more blocks into the same single eth_getLogs call. These raise the code defaults (event
  # 12s, head 6s) to trade a bounded detection lag for a large drop in RPC volume.
  #   - EVENT_POLL_INTERVAL_MS gates eth_blockNumber + eth_getLogs, PER live source. Dominant
  #     term (19 sources today), so this is the biggest lever. Max lag to detect a new
  #     proposal/vote = this interval.
  #   - HEAD_POLL_INTERVAL_MS gates the per-chain HeadTracker. Reconcilers are gap-bounded to
  #     2h regardless, and the lag gauge + timestamp filler tolerate a stale head, so raising
  #     it is safe. The event poller derives its own confirmed head per tick, so it is
  #     unaffected by this.
  EVENT_POLL_INTERVAL_MS: '3600000'
  HEAD_POLL_INTERVAL_MS: '3600000'
  # One eth_call (getPowerCurrent) per delegate per sweep; BATCH_SIZE is concurrency, not a
  # cap. 7200 blocks ≈ daily, up from the code default of 450 (≈90 min).
  AAVE_DELEGATION_SWEEP_COOLDOWN_BLOCKS: '7200'
  # Aave cross-chain stitch deferral (KNOWN-028). A payload/vote whose counterpart has not landed
  # steps aside for this long instead of pinning the block-ordered queue head. Descoped
  # aave_payloads_controller rows have no counterpart coming, so they re-attempt and re-hold forever:
  # at the 60s code default that is ~72k wasted UPDATEs/day. An hour matches the poll cadence.
  AAVE_STITCH_HOLD_BACKOFF_MS: '3600000'
  # Aave proposal title/description enrichment. ipfs.io's path gateway was retired in September
  # 2026; use two independent public gateways and allow enough time for an uncached CID fetch.
  IPFS_GATEWAY_URL: https://ipfs.filebase.io/ipfs
  IPFS_GATEWAY_FALLBACK_URL: https://gateway.pinata.cloud/ipfs
  IPFS_FETCH_TIMEOUT_MS: '15000'
  # Calldata decoder (apps/indexer). When enabled, an undecodable proposal_action is enriched by
  # fetching the target's verified ABI from the Etherscan V2 unified API (one key, all chains via a
  # chainid param), caching it in abi_cache/selector_index so subsequent decodes are free. This is
  # the intended long-tail coverage path for governance actions that call arbitrary contracts (the
  # bundled ABI library only covers well-known core contracts). Requires ETHERSCAN_API_KEY in
  # kvorum-secrets (already mounted on the indexer). Off ⇒ decoder relies on bundled ABIs + proxy
  # resolution only, and proposals with any undecodable action are excluded from the AI mismatch
  # detector. See #620.
  ETHERSCAN_ENRICHMENT_ENABLED: 'true'
  # ── AI worker (apps/ai-worker) ──
  # Monthly hard budget ceilings, USD (ADR-079). AiBudgetCapService recomputes
  # month-to-date spend every 5 min and disables a feature at ≥100% of its cap at both
  # the enqueue and the consume side; it auto-recovers on the 1st. Tightened below the
  # code defaults (5/20/15/1 = $41) for this non-revenue deployment → $5/mo ceiling. Raise
  # before re-running a backfill, or the feature disables itself part-way through.
  AI_CAP_SUMMARIZE_USD: '1'
  AI_CAP_MISMATCH_USD: '2'
  AI_CAP_FORUM_SYNTHESIS_USD: '1'
  AI_CAP_EMBED_USD: '1'
  # Steady-state trigger flags (ADR-078). Read from env every scan tick. ENABLED at
  # go-live (the initial deploy landed the worker inert and healthy; LLM keys are in
  # kvorum-secrets, pgvector is present). With these on, newly-transitioned
  # proposals/threads (all DAOs) get summarized/analysed within the scan lookback,
  # bounded by the $5/mo caps above. The one-time historical backfill is a separate,
  # transient toggle — see docs/runbooks/deployment.md and docs/runbooks/m5-ai-backfill.md,
  # not committed here. To pause a feature, set its flag back to 'false' (a deploy or
  # rollout restart re-reads env).
  AI_TRIGGER_SUMMARIZE_ENABLED: 'true'
  AI_TRIGGER_MISMATCH_ENABLED: 'true'
  AI_TRIGGER_FORUM_SYNTHESIS_ENABLED: 'true'
  AI_TRIGGER_EMBED_ENABLED: 'true'
