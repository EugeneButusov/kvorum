apiVersion: apps/v1
kind: Deployment
metadata:
  name: kvorum-api
  labels:
    app.kubernetes.io/name: kvorum-api
    app.kubernetes.io/part-of: kvorum
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kvorum-api
  strategy:
    # Single node: a surge pod has nowhere to land, so maxSurge 1 would stall the rollout.
    # Costs ~20s of downtime per deploy.
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kvorum-api
        app.kubernetes.io/part-of: kvorum
    spec:
      affinity:
        podAntiAffinity:
          # Keep the API off the indexer's node so its bursty derivation/RPC CPU cannot
          # degrade request latency. Preferred, not required — a hard rule leaves the set
          # Pending forever on a single node.
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: kvorum-indexer
                topologyKey: kubernetes.io/hostname
      # Soft self-spread: as more nodes are added, additional API replicas fan out
      # instead of stacking. ScheduleAnyway keeps single-node scheduling working.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: kvorum-api
      containers:
        - name: api
          image: ghcr.io/kvorum/kvorum:latest
          command: ['node', 'dist/apps/api/main.js']
          ports:
            - name: http
              containerPort: 3001
            - name: metrics
              containerPort: 9091
          envFrom:
            - configMapRef:
                name: kvorum-config
            - secretRef:
                name: kvorum-secrets
          env:
            - name: OTEL_SERVICE_NAME
              value: api
            # Postgres pool ceiling per replica. Kept small because the managed PG allows only
            # ~25 connections total and this deployment is capped at 2 replicas (see api-hpa).
            # See the PG_POOL_MAX note in libs/db/src/client.ts.
            - name: PG_POOL_MAX
              value: '2'
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
