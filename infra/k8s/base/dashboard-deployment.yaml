apiVersion: apps/v1
kind: Deployment
metadata:
  name: kvorum-dashboard
  labels:
    app.kubernetes.io/name: kvorum-dashboard
    app.kubernetes.io/part-of: kvorum
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kvorum-dashboard
  strategy:
    # Single-node topology: a surge pod has nowhere to land, so maxSurge 1 / maxUnavailable 0
    # leaves the new pod Pending until deploy.yml's rollout-status timeout fails the deploy.
    # Replace-then-start instead and accept ~20s of downtime per deploy.
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kvorum-dashboard
        app.kubernetes.io/part-of: kvorum
    spec:
      affinity:
        podAntiAffinity:
          # Prefer to keep the public-facing SSR/BFF process off the indexer's node (same
          # rule as the API). Preferred, not required: on the single-node topology a hard
          # rule leaves the pod Pending forever. Spreads first once a node is added.
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: kvorum-indexer
                topologyKey: kubernetes.io/hostname
      # Soft self-spread: as more nodes are added, extra dashboard replicas fan out
      # instead of stacking. ScheduleAnyway keeps single-node scheduling working.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: kvorum-dashboard
      containers:
        - name: dashboard
          image: ghcr.io/kvorum/kvorum:latest
          # `next start` serves the prebuilt apps/dashboard/.next from the shared image.
          command: ['pnpm', '--filter', 'dashboard', 'start']
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            # Non-secret config (BACKEND_API_URL). The dashboard is a pure BFF: it
            # forwards the session cookie to the API and holds NO backend secrets of
            # its own, so kvorum-secrets is deliberately NOT mounted here.
            - configMapRef:
                name: kvorum-config
          env:
            # Port `next start` binds (it reads PORT, not the API's API_PORT).
            - name: PORT
              value: '3000'
            # BFF read secret (ADR-084) the same-origin proxy presents to the API's
            # ApiKeyGuard so anonymous public reads work. Single-key ref → the dashboard
            # gets ONLY this key, never the full kvorum-secrets. optional:true keeps the pod
            # bootable before the key exists (reads just 401 until it's provisioned).
            - name: INTERNAL_READ_TOKEN
              valueFrom:
                secretKeyRef:
                  name: kvorum-secrets
                  key: INTERNAL_READ_TOKEN
                  optional: true
          readinessProbe:
            # /healthz returns 200 without touching the backend, so the pod stays
            # Ready through API blips. /api/* is the BFF proxy — never probe it.
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              # Headroom over the API's 512Mi — React SSR peaks higher under load.
              cpu: 500m
              memory: 768Mi
