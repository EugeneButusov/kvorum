name: Deploy

# Auto-deploy on merge to the default branch. Build once, gate on migrations, then
# roll the api, indexer, ai-worker, and dashboard Deployments. The only credential
# this workflow holds is a
# scoped DigitalOcean token stored as a `production` Environment secret — no app
# secrets ever touch CI (they live only in the in-cluster kvorum-secrets Secret).
on:
  push:
    branches: [main]

# Serialize deploys — never roll two builds concurrently. Do NOT cancel in progress:
# a half-applied rollout is worse than waiting.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write # push image to GHCR via the automatic GITHUB_TOKEN

jobs:
  build:
    name: Build & push image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image name (GHCR requires lowercase)
        id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            BUILD_SHA=${{ github.sha }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Migrate & roll out
    needs: build
    runs-on: ubuntu-latest
    # Requires a protected Environment named `production` holding:
    #   secret DEPLOY_SSH_KEY      — private key for the deploy user on the droplet
    #   secret DEPLOY_KNOWN_HOSTS  — `ssh-keyscan <host>` output, so the host key is pinned
    #   secret DEPLOY_HOST         — user@host of the droplet
    environment: production
    env:
      IMAGE: ${{ needs.build.outputs.image }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Install kustomize
        run: |
          set -euo pipefail
          curl -sfLo kustomize.tar.gz \
            https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz
          tar -xzf kustomize.tar.gz
          sudo install kustomize /usr/local/bin/kustomize

      # Pin the image here rather than on the droplet, so the host needs only kubectl
      # (which k3s ships) and the tarball is a complete, self-describing deploy unit.
      - name: Pin the built image in the prod overlay
        run: |
          set -euo pipefail
          cd infra/k8s/overlays/prod
          kustomize edit set image "ghcr.io/kvorum/kvorum=${IMAGE}"
          grep -A3 '^images:' kustomization.yaml

      - name: Configure SSH
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Host key pinned from a secret — never StrictHostKeyChecking=no, which would
          # accept a man-in-the-middle on the one channel that can change production.
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Copy manifests to the host
        run: |
          set -euo pipefail
          tar czf deploy-bundle.tar.gz infra/k8s infra/scripts/deploy.sh
          scp -i ~/.ssh/id_deploy -o IdentitiesOnly=yes \
            deploy-bundle.tar.gz "${{ secrets.DEPLOY_HOST }}:/tmp/deploy-bundle.tar.gz"

      # Everything below happens on the droplet, via the same script a manual deploy runs.
      - name: Migrate and roll out
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes "${{ secrets.DEPLOY_HOST }}" \
            "set -euo pipefail
             rm -rf ~/kvorum-deploy && mkdir -p ~/kvorum-deploy
             tar xzf /tmp/deploy-bundle.tar.gz -C ~/kvorum-deploy
             rm -f /tmp/deploy-bundle.tar.gz
             ~/kvorum-deploy/infra/scripts/deploy.sh '${IMAGE}'"
