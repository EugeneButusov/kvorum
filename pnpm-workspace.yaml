packages:
  - 'apps/*'
  - 'libs/*'
  - 'libs/sources/*'
  - 'nest/actors'
  - 'nest/analytics'
  - 'nest/auth'
  - 'nest/chain'
  - 'nest/daos'
  - 'nest/db'
  - 'nest/delegations'
  - 'nest/logging'
  - 'nest/observability'
  - 'nest/proposals'
  - 'nest/sources/*'
  - 'nest/votes'
  - 'tests/e2e'
overrides:
  # pnpm 11 reads overrides from here, not package.json#pnpm.overrides.
  # ws: ethers pins 8.17.1 (vulnerable, GHSA-96hv-2xvq-fx4p); pin to the patched line.
  # postcss: two advisories via next>postcss — <=8.5.11 arbitrary file read (GHSA-6g55-p6wh-862q)
  # and <=8.5.17 path traversal in previous source map (GHSA-r28c-9q8g-f849); pin the latest 8.5.x.
  'next>postcss': '8.5.25'
  # nanoid: next>postcss pulls the 3.x line (vulnerable, GHSA-2v37-7h3g-55p8 — a custom generator with
  # size 0 loops indefinitely). The advisory's vulnerable range was widened to <3.3.18, so the earlier
  # 3.3.17 pin no longer clears it; rewrite the vulnerable 3.x range to the patched 3.3.18 (patch bump,
  # API-compatible); a 4.x/5.x consumer is untouched.
  'nanoid@<3.3.18': '3.3.18'
  'ws': '8.21.0'
  # multer: @nestjs/platform-express pulls 1.x (vulnerable, GHSA-72gw-mp4g-v24j). The earlier
  # ^2.2.0 pin resolved to 2.2.0, which three later advisories cover — GHSA-wc9g-mqfw-jrwm
  # (crafted upload DoS), GHSA-qfvm-cv95-jqjf (fd leak on aborted uploads, no patch for 2.2.0
  # itself) and GHSA-535w-7cp7-47q4 (oversized array index in field names). All are patched in
  # 2.3.0. API-compatible for our usage (the read API uses no file uploads).
  'multer': '^2.3.0'
  'express>qs': '6.15.2'
  'body-parser>qs': '6.15.2'
  'superagent>qs': '6.15.2'
  # proxy-addr: express pulls 2.0.7 (vulnerable, GHSA-jqcg-44mw-7w3h — IPv4-mapped IPv6
  # addresses can bypass trusted-subnet checks). Rewrite the vulnerable 2.x range to 2.0.8.
  'proxy-addr@<2.0.8': '2.0.8'
  # source-map-js: next>postcss pulls 1.2.1 (vulnerable, GHSA-68fv-2mgg-jv7q — crafted
  # indexed source-map offsets can block the event loop). The patched release is a patch bump.
  'source-map-js@<1.2.2': '1.2.2'
  # js-yaml: @nestjs/swagger + dev tooling pull the 4.x line (vulnerable). Three chained
  # advisories force quadratic CPU on adversarial YAML — GHSA-52cp-r559-cp3m (merge-key chains,
  # patched 4.3.0), GHSA-5p4m-2wfm-xmqj / CVE-2026-59870 (!!omap resolution, patched 4.3.1) and
  # the maxTotalMergeKeys bypass (patched 4.3.2), which widened the vulnerable range past the
  # previous 4.3.1 pin. Rewrite the vulnerable range to the latest patched 4.x; a 3.x/5.x
  # consumer is untouched.
  'js-yaml@>=4.0.0 <4.3.2': '4.3.2'
  # sharp: next pulls a vulnerable line through its image optimizer. The earlier 0.35.4 pin is
  # now covered by GHSA-wq5f-xc86-pv6w (bundled librsvg); rewrite the vulnerable range to the
  # patched 0.35.x release. Next's image-optimization API is unaffected by the patch bump.
  'sharp@<0.35.5': '0.35.5'
  # browserslist: next>styled-jsx>@babel/core pulls <=4.28.6 (two high advisories —
  # GHSA-c83g-rgw3-j3cx unbounded memory growth, GHSA-73wf-gq98-2v4g prototype write
  # via untrusted stats). Rewrite the vulnerable range to the patched 4.28.7.
  'browserslist@<=4.28.6': '4.28.7'
allowBuilds:
  '@nestjs/core': true
  '@parcel/watcher': true
  '@scarf/scarf': false
  '@swc/core': true
  esbuild: true
  lefthook: true
  less: true
  sharp: true
  unrs-resolver: true
